name: Testes automatizados

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Formatação e testes Rust
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Instalar dependências do sistema
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git pkg-config zstd \
            libopus-dev

      - name: Obter código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Instalar Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verificar formatação
        run: cargo fmt --manifest-path app/Cargo.toml -- --check

      - name: Restaurar cache de dependências
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-debian-trixie-${{ runner.arch }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: |
            cargo-debian-trixie-${{ runner.arch }}-

      - name: Compilar e executar testes
        run: cargo test --locked --manifest-path app/Cargo.toml
