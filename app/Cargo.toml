[package]
name = "micbridge"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
async-trait = "0.1.92"
axum = "0.8.9"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
bytes = "1.12.1"
futures = "0.3.34"
getrandom = "0.4.3"
glib = "0.22.10"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_16"] }
ksni = "0.3.6"
libc = "0.2.190"
nnnoiseless = "0.5.2"
opus = "0.3"
qrcode = { version = "0.14.1", default-features = false }
rcgen = "0.14"
rtc = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = "0.3"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
webrtc = "0.21.0"
