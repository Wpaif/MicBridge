      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>
  <g fill="url(#ink)">
    <rect x="24" y="70.0" width="8" height="22.0" rx="4"/><rect x="36" y="40.2" width="8" height="51.8" rx="4"/><rect x="48" y="32.3" width="8" height="59.7" rx="4"/><rect x="60" y="30.0" width="8" height="62.0" rx="4"/><rect x="72" y="32.3" width="8" height="59.7" rx="4"/><rect x="84" y="40.2" width="8" height="51.8" rx="4"/><rect x="96" y="70.0" width="8" height="22.0" rx="4"/>
  </g>
